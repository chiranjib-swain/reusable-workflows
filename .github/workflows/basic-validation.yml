# This workflow helps ensure that the code of the action we're going to deploy:
# 1. Is well-formated
# 2. Is linted
# 3. Successfully builds
# 4. Passes unit-tests
# Additionally node packages used by the action can be audited.

name: Basic validation

on:
  workflow_call:
    inputs:
      operating-systems:
        description: "Optional input to set a list of operating systems which the workflow uses. Defaults to ['ubuntu-latest', 'windows-latest', 'macos-latest'] if not set"
        required: false
        type: string
        default: "['ubuntu-latest', 'windows-latest', 'macos-latest']"
      enable-audit:
        description: "Optional input to enable npm package audit process"
        required: false
        type: boolean
        default: true
      node-version:
        description: "Optional input to set the version of Node.js used to build the project. The input syntax corresponds to the setup-node's one"
        required: false
        type: string
        default: "24.x"
      node-caching:
        description: "Optional input to set up caching for the setup-node action. The input syntax corresponds to the setup-node's one. Set to an empty string if caching isn't needed"
        required: false
        type: string
        default: "npm"

jobs:
  build:
    runs-on: ${{matrix.operating-systems}}
    strategy:
      fail-fast: false
      matrix:
        operating-systems: ${{fromJson(inputs.operating-systems)}}
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup Node.js ${{inputs.node-version}}
      uses: actions/setup-node@v6
      with:
        node-version: ${{inputs.node-version}}
        cache: ${{inputs.node-caching}}

    - name: Install dependencies
      run: npm ci --ignore-scripts
      
    - name: Run prettier
      run: npm run format-check

    # - name: Run linter
    #   run: npm run lint

    # - name: Build
    #   run: npm run build

    # - name: Test
    #   run: npm test

    - name: Audit packages (capture output)
      if: ${{inputs.enable-audit}}
      shell: bash
      run: |
        set +e
        npm audit --audit-level=high 2>&1 | tee npm-audit.txt
        echo "NPM_AUDIT_EXIT=$?" >> $GITHUB_ENV
        set -e

    - name: Audit packages (emit clear annotations)
      if: ${{inputs.enable-audit}}
      shell: bash
      run: |
        node <<'NODE'
        const fs = require('fs');
    
        const text = fs.readFileSync('npm-audit.txt', 'utf8');
    
        const blocks = text
          .split(/\r?\n\r?\n+/)
          .map(b => b.trim())
          .filter(Boolean);
    
        function pickCmd(sev) {
          sev = (sev || '').toLowerCase();
          if (sev === 'high' || sev === 'critical') return 'error';
          if (sev === 'moderate' || sev === 'medium') return 'warning';
          return 'notice';
        }
    
        function firstGhsaLine(lines) {
          return lines.find(l => l.includes('https://github.com/advisories/')) || '';
        }
    
        const emitted = new Set();
    
        for (const block of blocks) {
          const lines = block.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    
          const pkgLine = lines[0] || '';
          const sevLine = lines.find(l => /^Severity:/i.test(l)) || '';
          const sev = sevLine.replace(/^Severity:\s*/i, '').trim();
    
          if (!pkgLine || !sevLine) continue;
          if (/^#\s*npm audit report/i.test(pkgLine)) continue;
    
          const advisory = firstGhsaLine(lines);
          if (!advisory) continue;
    
          const key = `${pkgLine}|${sev}|${advisory}`;
          if (emitted.has(key)) continue;
          emitted.add(key);
    
          const cmd = pickCmd(sev);
          process.stdout.write(`::${cmd} ::${pkgLine} / Severity: ${sev} / ${advisory}\n`);
        }
        NODE

    - name: Audit packages (fail if vulnerabilities found)
      if: ${{inputs.enable-audit}}
      shell: bash
      run: |
        if [ "${NPM_AUDIT_EXIT}" != "0" ]; then
          echo "npm audit failed with exit code ${NPM_AUDIT_EXIT}"
          exit "${NPM_AUDIT_EXIT}"
        fi
